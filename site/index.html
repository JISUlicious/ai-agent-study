<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM to Agent Evolution</title>
<meta name="claude:viewport-fit-sides" content="true">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #1f2933;
    --muted: #6b7682;
    --line: #dfe4ea;
    --edge: #a9b3bf;
    --yellow: #fff1a8;  --yellow-b: #e6c84a;
    --blue: #cfe4ff;    --blue-b: #7fb0ee;
    --pink: #ffd0d4;    --pink-b: #ef8f98;
    --green: #cdf0d0;   --green-b: #79c583;
    --prev: #2f6fde;
    --next: #e0553d;
  }
  /* 사용자 요청으로 어두운 테마에서도 흰 배경을 유지합니다. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #ffffff; --ink: #1f2933; } }
  :root[data-theme="dark"] { --bg: #ffffff; --ink: #1f2933; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans KR", system-ui, sans-serif; }
  header { padding: 20px max(16px, env(safe-area-inset-left)) 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .bar { padding: 0 16px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .sw { display: inline-flex; align-items: center; gap: 6px; }
  .sw i { width: 18px; height: 12px; border-radius: 3px; border: 1.5px solid; display: inline-block; }
  .sw .ln { width: 22px; height: 0; border: 0; border-top: 2.5px solid; border-radius: 0; }
  .sw .ln.dash { border-top-style: dashed; }
  .zoom { margin-left: auto; display: flex; gap: 6px; }
  button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  button:hover { background: #f4f6f8; }
  button:focus-visible { outline: 2px solid var(--prev); outline-offset: 2px; }
  .node:focus { outline: none; }
  .node:focus-visible rect { stroke: var(--ink); stroke-width: 3; }
  .info { margin: 0 16px 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; min-height: 46px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .info b { font-weight: 600; }
  .info .lab { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .chip { border: 1.5px solid; border-radius: 999px; padding: 2px 10px; font-size: 13px; background: #fff; cursor: pointer; }
  .chip.s { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .chip.p { border-color: var(--prev); color: var(--prev); }
  .chip.n { border-color: var(--next); color: var(--next); }
  .wrap { border: 1px solid var(--line); border-radius: 12px; overflow: auto; flex: 1 1 0; min-width: 0; min-height: 0; background: #fff; cursor: grab; }
  .wrap.drag { cursor: grabbing; }
  svg { display: block; }
  .edge path { fill: none; stroke: var(--edge); stroke-width: 2; }
  .edge polygon { fill: var(--edge); }
  .edge.dash path { stroke-dasharray: 7 6; }
  .edge text { font-size: 13px; fill: var(--muted); paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  .node { cursor: pointer; }
  .node rect { stroke-width: 2; }
  .node text { font-size: 16px; fill: var(--ink); text-anchor: middle; pointer-events: none; }
  .node .sub { font-size: 13px; fill: #4a5561; }
  .node.yellow rect { fill: var(--yellow); stroke: var(--yellow-b); }
  .node.blue rect { fill: var(--blue); stroke: var(--blue-b); }
  .node.pink rect { fill: var(--pink); stroke: var(--pink-b); }
  .node.green rect { fill: var(--green); stroke: var(--green-b); }
  .node:hover rect { stroke-width: 3; }
  svg.sel .node { opacity: 0.3; transition: opacity .15s; }
  svg.sel .edge { opacity: 0.18; transition: opacity .15s; }
  svg.sel .node.on, svg.sel .edge.on { opacity: 1; }
  svg.sel .node.me rect { stroke: var(--ink); stroke-width: 3.5; }
  svg.sel .node.prev rect { stroke: var(--prev); stroke-width: 3; }
  svg.sel .node.next rect { stroke: var(--next); stroke-width: 3; }
  svg.sel .edge.in path { stroke: var(--prev); stroke-width: 3; }
  svg.sel .edge.in polygon { fill: var(--prev); }
  svg.sel .edge.out path { stroke: var(--next); stroke-width: 3; }
  svg.sel .edge.out polygon { fill: var(--next); }
  .stage { display: flex; gap: 12px; flex: 1 1 0; min-height: 320px; margin: 0 16px 16px; }
  .side { flex: 0 0 320px; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 14px; line-height: 1.5; position: relative; }
  .side[hidden] { display: none; }
  .card { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; background: #fff; }
  .card h2 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .card h2::before { content: ""; flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; background: var(--line); transform: translateY(-1px); }
  .card.yellow h2::before { background: var(--yellow-b); }
  .card.blue h2::before { background: var(--blue-b); }
  .card.pink h2::before { background: var(--pink-b); }
  .card.green h2::before { background: var(--green-b); }
  .card p { margin: 6px 0 0; white-space: pre-line; }
  .card .empty { color: #a3acb6; }
  #sideBtn[aria-pressed="true"] { background: #f1f3f5; }
  @media (max-width: 760px) { .stage { flex-direction: column; } .side { flex: 0 0 42%; } }
  @media (prefers-reduced-motion: reduce) { svg.sel .node, svg.sel .edge { transition: none; } }
</style>
</head>
<body>


<header>
  <h1>LLM에서 에이전트까지</h1></header>

<div class="bar">
  <div class="legend">
    <span class="sw"><i style="background:var(--yellow);border-color:var(--yellow-b)"></i>Agent component</span>
    <span class="sw"><i style="background:var(--blue);border-color:var(--blue-b)"></i>Technique / concept</span>
    <span class="sw"><i style="background:var(--pink);border-color:var(--pink-b)"></i>Limit</span>
    <span class="sw"><i style="background:var(--green);border-color:var(--green-b)"></i>Response to a limit</span>
    <span class="sw"><i class="ln dash" style="border-color:var(--edge)"></i>한계의 원인</span>
    <span class="sw"><i class="ln" style="border-color:var(--prev)"></i>이전</span>
    <span class="sw"><i class="ln" style="border-color:var(--next)"></i>다음</span>
  </div>
  <div class="zoom">
    <button id="zout" aria-label="축소">−</button>
    <button id="zin" aria-label="확대">+</button>
    <button id="zfit">전체 보기</button>
    <button id="clear">선택 해제</button>
    <button id="sideBtn" aria-pressed="true">설명 패널</button>
  </div>
</div>

<div class="info" id="info" aria-live="polite"></div>
<div class="stage">
  <div class="wrap" id="wrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside class="side" id="side" aria-label="선택한 노드 설명" hidden></aside>
</div>

    EDGES.forEach((e, i) => {
      const g = edgeEls[i], p = routes[i];
      g.firstChild.setAttribute("d", pathD(p, 9));
      g.children[1].setAttribute("points", head(p));
      if (e.l) {
        let bi = 0, bl = -1;
        for (let q = 0; q < p.length - 1; q++) { const l = Math.abs(p[q + 1][0] - p[q][0]) + Math.abs(p[q + 1][1] - p[q][1]); if (l > bl) { bl = l; bi = q; } }
        const t = g.children[2]; t.setAttribute("x", (p[bi][0] + p[bi + 1][0]) / 2 + 6); t.setAttribute("y", (p[bi][1] + p[bi + 1][1]) / 2 - 6);
      }
    });
  }

  // ── 선택 ──
  const sel = new Set();
  let listOpen = false;
  const name = id => byId[id].t.replace(/\n/g, " ");
  function select(id) {
    if (sel.has(id)) sel.delete(id); else { sel.add(id); focusId = id; }
    paint();
  }
  function hint(text) { const s = document.createElement("span"); s.style.color = "var(--muted)"; s.textContent = text; info.appendChild(s); }
  function paint() { paintMain(); renderSide(); }
  function paintMain() {
    Object.values(nodeEls).forEach(g => g.classList.remove("on", "me", "prev", "next"));
    edgeEls.forEach(g => g.classList.remove("on", "in", "out"));
    svg.classList.toggle("sel", sel.size > 0);
    info.textContent = "";
    if (!sel.size) { hint("노드를 누르면 바로 이전 노드와 다음 노드만 남습니다. 여러 노드를 이어서 선택할 수 있고, 배경을 누르거나 Esc로 모두 해제합니다."); return; }
    const prev = [], next = [];
    sel.forEach(id => nodeEls[id].classList.add("on", "me"));
    EDGES.forEach((e, i) => {
      if (sel.has(e.t)) { edgeEls[i].classList.add("on", "in"); if (!sel.has(e.f)) { nodeEls[e.f].classList.add("on", "prev"); if (!prev.includes(e.f)) prev.push(e.f); } }
      if (sel.has(e.f)) { edgeEls[i].classList.add("on", "out"); if (!sel.has(e.t)) { nodeEls[e.t].classList.add("on", "next"); if (!next.includes(e.t)) next.push(e.t); } }
    });
    const sum = document.createElement("span"); sum.textContent = "선택 " + sel.size + " · 이전 " + prev.length + " · 다음 " + next.length; info.appendChild(sum);
    const tg = document.createElement("button"); tg.textContent = listOpen ? "목록 접기" : "목록 펼치기"; tg.setAttribute("aria-expanded", listOpen ? "true" : "false");
    tg.addEventListener("click", () => { listOpen = !listOpen; paint(); }); info.appendChild(tg);
    if (!listOpen) return;
    const br = document.createElement("span"); br.style.flexBasis = "100%"; info.appendChild(br);
    sel.forEach(id => { const b = document.createElement("button"); b.className = "chip s"; b.textContent = name(id) + " ×"; b.setAttribute("aria-label", name(id) + " 선택 해제"); b.addEventListener("click", () => { sel.delete(id); paint(); }); info.appendChild(b); });
    const add = (label, ids, cls) => {
      const l = document.createElement("span"); l.className = "lab"; l.textContent = label + " " + ids.length; info.appendChild(l);
      ids.forEach(id => { const c = document.createElement("button"); c.className = "chip " + cls; c.textContent = name(id); c.addEventListener("click", () => { sel.add(id); focusId = id; paint(); focusNode(id); }); info.appendChild(c); });
    };
    add("이전", prev, "p"); add("다음", next, "n");
  }

  // ── 설명 패널: 선택한 노드마다 "제목 + 핵심 내용" 카드를 세로로 쌓습니다. ──
  // 노드마다 한두 문장의 핵심 내용입니다. 열쇠는 NODES의 id입니다. (초고)
  const CONTENT = {
    "mwjxwa1y-01ty8": "대량의 텍스트로 학습해, 주어진 글 다음에 올 내용을 만들어 내는 모델입니다. 에이전트에서는 다음 행동을 고르는 두뇌 역할을 합니다.",

    "mwjxxubs-15e8q": "정답 표시 없이, 대량의 텍스트에서 다음 토큰을 맞히도록 학습하는 단계입니다. 언어와 지식의 기초가 여기서 만들어집니다.",
    "mwjxye6q-1i6kc": "사전학습에 쓰인 텍스트 묶음입니다. 모델이 아는 것은 이 데이터에 들어 있던 내용, 수집한 시점까지로 한정됩니다.",
    "mwjxwork-05vok": "앞의 글을 보고 다음 토큰의 확률을 계산하는 것이 LLM이 하는 일의 전부입니다. 기준은 사실 여부가 아니라 그럴듯함입니다.",
    "mwjxx3ut-0dk24": "다음 토큰을 하나 뽑아 붙이는 일을 반복해 글을 만듭니다. 확률에서 뽑기 때문에 같은 입력에도 결과가 달라질 수 있습니다.",
    "mwjxz6hj-1rh6r": "학습 데이터에 없던 정보와 학습 시점 이후의 일은 모릅니다. 회사 내부 문서나 최신 소식이 대표적입니다.",
    "mwjxyspb-1p0l4": "모르는 내용도 그럴듯한 문장으로 지어냅니다. 다음 토큰을 확률로 고르는 방식에서 나오는 한계입니다.",
    "e1": "LLM은 입력을 한 번 받아 곧바로 답을 만들어 냅니다. 그래서 여러 단계를 거쳐야 하는 복잡한 문제는 중간 과정을 건너뛰어 틀리기 쉽습니다.",
    "mwjy2sm9-22p1i": "모델이 모르는 것을 채워 주는 방향입니다. 필요한 정보를 입력에 넣어 주거나, 추가 학습으로 모델 안에 넣습니다.",
    "mwjy3xah-28k0v": "답을 바로 내지 않고, 질문을 풀어 가는 과정을 먼저 쓰게 하는 방향입니다.",
    "mwjz48wn-1u5il": "큰 일을 한 번에 시키지 않고, 작은 단계로 나눠 차례로 처리하는 방향입니다.",
    "mwjyix9o-0pluh": "모델 크기, 데이터, 연산량을 함께 키우면 성능이 꾸준히 오른다는 관찰입니다. 규모가 커지면서 작은 모델에는 없던 능력이 나타났습니다.",
    "mwjykt85-0wb2z": "추가 학습 없이, 입력에 넣어 준 예시와 정보만으로 새 일을 해내는 능력입니다. 프롬프트로 모델을 다루는 모든 기법의 바탕입니다.",
    "mwjyjr9p-0th2v": "자연어로 준 지시를 이해하고 그에 맞게 수행하는 능력입니다. 모델 크기가 커지면서 점차 나타나지만, 지시를 안정적으로 따르게 되는 것은 주로 instruction tuning을 통해서입니다.",
    "mwjy4shv-2agud": "답을 내기 전에 풀이 과정을 단계별로 쓰게 하는 기법입니다. 충분히 큰 모델에서 추론 문제의 정확도가 크게 오릅니다.",
    "mwjy8wog-0f96a": "사전학습된 모델을 더 작은 데이터로 추가 학습해, 특정 지식이나 행동을 넣는 방법입니다.",
    "mwjymvvz-1d2vd": "다양한 '지시 → 응답' 쌍으로 추가 학습해, 처음 보는 지시도 따르게 만드는 fine-tuning입니다.",
    "mwjyn9wl-1hmgr": "JSON처럼 정해진 형식에 맞춰 출력하는 능력입니다. 프로그램이 모델의 출력을 읽어 그대로 실행할 수 있게 됩니다.",
    "mwjz5h1e-2824t": "원하는 결과가 나오도록 지시, 예시, 형식을 설계하는 일입니다. 모델은 그대로 두고 입력만으로 동작을 조정합니다.",
    "mwjz4wb3-207i0": "일을 여러 프롬프트로 나누고, 앞 단계의 출력을 다음 단계의 입력으로 넘깁니다. 단계는 사람이 미리 정합니다.",
    "e47": "답하기 전에 스스로 생각하는 과정을 거치도록 학습된 모델입니다. 프롬프트로 유도하던 Chain-of-Thought가 모델의 기본 동작이 됐습니다.",
    "mwjy13yr-1y3l3": "질문과 관련된 문서를 검색해 입력에 넣고, 그것을 근거로 답하게 합니다. 모델을 다시 학습하지 않고도 최신 지식과 내부 지식을 쓸 수 있습니다.",
    "mwk00wip-0bwb9": "컨텍스트 밖의 저장소(파일, 데이터베이스)에 정보를 두고, 필요할 때 찾아옵니다.",
    "mwk0b4wu-1do33": "목표를 이루기 위해 해야 할 일을 모델이 스스로 나누고 순서를 정합니다. 사람이 미리 짜 주던 작업 순서를 모델이 맡습니다.",
    "mwjynhq1-1jdr6": "모델이 외부 함수나 API의 호출을 요청하고, 그 결과를 받아 쓰는 능력입니다. 글만 쓰던 모델이 검색하고 실행할 수 있게 됩니다.",
    "mwjynw0i-1najs": "생각(Reason)과 도구 호출(Act)을 한 흐름으로 엮어, 결과를 보고 다음 행동을 정하는 방식입니다. 에이전트 루프의 원형이 됐습니다.",
    "e22": "지금까지의 생각, 행동, 관찰이 쌓인 기록입니다. 모델은 이 기록을 보고 다음 행동을 정합니다.",
    "mwjzmk38-025uz": "추론-행동-관찰의 과정을 반복합니다. 더 이상 할 행동이 없으면 loop가 종료됩니다.",
    "mwjz8n8c-2nzsh": "Transformer의 구조에서 오는 한계로, 한 번에 입력할 수 있는 양이 정해져 있습니다. 루프가 돌수록 기록이 쌓여 한도에 가까워지고, 중요한 내용이 묻힙니다.",
    "mwk03ffa-0ks1a": "매 단계마다 컨텍스트에 무엇을 넣고 무엇을 뺄지 관리하는 방향입니다.",
    "mwk03nod-0mzqw": "지시, 도구 정의, 기억, 기록 가운데 지금 필요한 것만 골라 컨텍스트를 구성하는 일입니다. 요약, 메모, 필요할 때만 불러오기가 대표적인 기법입니다.",
    "e44": "일의 일부를 별도의 컨텍스트를 가진 에이전트에게 맡기고, 결과 요약만 받습니다. 주 에이전트의 컨텍스트를 아낍니다.",
    "mwk068s5-0wxfu": "특정 작업의 절차와 스크립트를 묶어 두고, 필요할 때만 불러와 쓰는 방식입니다. 평소에는 이름과 설명만 컨텍스트에 둡니다.",
    "mwk05ygz-0sozz": "도구와 데이터를 에이전트에 연결하는 공통 규약(Model Context Protocol)입니다. 어떤 도구가 있고 어떻게 부르는지 알려 주는 방법까지 규약에 들어 있어, 한 번 만든 도구를 여러 에이전트가 찾아 쓸 수 있습니다.",
    "e8": "화면을 보고 마우스와 키보드를 조작해 일반 프로그램을 다루는 도구입니다. API가 없는 프로그램도 쓸 수 있게 됩니다.",
    "e38": "긴 작업을 하다가, 일이 남았는데도 끝났다고 판단해 멈추는 한계입니다.",
    "e39": "완료 조건을 정해 두고, 그 조건을 채울 때까지 계속 일하게 하는 방향입니다.",
    "e9": "목표가 달성될 때까지 같은 지시로 에이전트를 반복 실행하는 방식입니다. 멈추려는 시점에 완료 여부를 확인해 다시 돌립니다.",
    "e24": "같은 지시에도 매번 다르게 행동하고, 지시를 항상 지키지는 않습니다. 스스로 실행까지 하는 에이전트에서는 위험이 됩니다.",
    "e31": "무엇을 하든 피해가 닿는 범위를 미리 좁혀 두는 방향입니다.",
    "e25": "반드시 지켜야 할 일은 모델의 판단에 맡기지 않고, 코드나 사람이 강제하는 방향입니다.",
    "e7": "에이전트의 명령을 격리된 환경에서 실행해, 접근할 수 있는 파일과 네트워크를 제한합니다.",
    "mwk09djm-143t1": "루프의 정해진 시점(도구 실행 전후, 종료 시 등)에 반드시 실행되는 코드입니다. 검사, 차단, 자동 처리를 모델의 판단과 무관하게 수행합니다.",
    "e33": "위험할 수 있는 행동은 실행하기 전에 사람에게 승인을 받습니다.",
    "mwk09zhu-19vjd": "코딩뿐 아니라 컴퓨터를 이용한 다양한 작업으로 능력이 확장된 범용 에이전트입니다."
  };
  const side = document.getElementById("side"), sideBtn = document.getElementById("sideBtn");
  let focusId = null, sideOn = true;
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  function card(id) {
    const el = mk("article", "card " + byId[id].c);
    el.appendChild(mk("h2", "", name(id)));
    el.appendChild(CONTENT[id] ? mk("p", "", CONTENT[id]) : mk("p", "empty", "아직 내용이 없습니다."));
    return el;
  }
  function renderSide() {
    if (!sel.has(focusId)) focusId = sel.size ? [...sel][sel.size - 1] : null;
    const show = sideOn && sel.size > 0;
    side.hidden = !show; if (!show) return;
    side.textContent = "";
    let cur = null;
    sel.forEach(id => { const c = card(id); if (id === focusId) cur = c; side.appendChild(c); });
    if (cur) side.scrollTop = Math.max(0, cur.offsetTop - 12);   // 방금 고른 카드가 보이게 합니다.
  }
  sideBtn.onclick = () => { sideOn = !sideOn; sideBtn.setAttribute("aria-pressed", sideOn ? "true" : "false"); renderSide(); };

  // ── 확대와 이동 ──
  let scale = 0.6;
  // ax, ay: 확대의 기준점(틀 안의 좌표). 없으면 틀의 가운데를 기준으로 합니다.
  function setScale(s, keep, ax, ay) {
    const old = scale; scale = Math.max(0.15, Math.min(2.4, s));
    if (ax == null) { ax = wrap.clientWidth / 2; ay = wrap.clientHeight / 2; }
    const mx = wrap.scrollLeft + ax, my = wrap.scrollTop + ay;
    svg.setAttribute("width", W * scale); svg.setAttribute("height", H * scale);
    if (keep) { wrap.scrollLeft = mx * scale / old - ax; wrap.scrollTop = my * scale / old - ay; }
  }
  // 틀 위에서 Ctrl/⌘ + 휠 또는 트랙패드 핀치: 마우스가 놓인 곳을 기준으로 확대합니다.
  wrap.addEventListener("wheel", e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    setScale(scale * Math.exp(-Math.max(-25, Math.min(25, e.deltaY)) * 0.01), true, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  function fit() { setScale(Math.min((wrap.clientWidth - 4) / W, (wrap.clientHeight - 4) / H)); wrap.scrollLeft = 0; wrap.scrollTop = 0; }
  function focusNode(id) {
    const n = byId[id];
    wrap.scrollTo({ left: (cx(n) - x0) * scale - wrap.clientWidth / 2, top: (cy(n) - y0) * scale - wrap.clientHeight / 2, behavior: "smooth" });
  }
  document.getElementById("zin").onclick = () => setScale(scale * 1.25, true);
  document.getElementById("zout").onclick = () => setScale(scale / 1.25, true);
  document.getElementById("zfit").onclick = fit;
  document.getElementById("clear").onclick = () => { sel.clear(); paint(); };

  let down = null, moved = false;
  wrap.addEventListener("pointerdown", e => { moved = false; if (e.pointerType !== "mouse") return; down = { x: e.clientX, y: e.clientY, l: wrap.scrollLeft, t: wrap.scrollTop }; });
  window.addEventListener("pointermove", e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) { moved = true; wrap.classList.add("drag"); }
    if (moved) { wrap.scrollLeft = down.l - dx; wrap.scrollTop = down.t - dy; }
  });
  window.addEventListener("pointercancel", () => { down = null; moved = false; wrap.classList.remove("drag"); });
  window.addEventListener("pointerup", () => { down = null; wrap.classList.remove("drag"); setTimeout(() => { moved = false; }, 0); });
  wrap.addEventListener("click", () => { if (!moved && sel.size) { sel.clear(); paint(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { sel.clear(); paint(); } });

  layout(); paint();
  window.__evo = { routes: () => routes, nodes: NODES, edges: EDGES };
})();
</script>
