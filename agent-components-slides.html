<style>
/* Layout: one-screen stage. Left = the component diagram (bottom-up tree in four columns), right = speaker panel that follows the selection. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #17212B;
  --muted: #5C6977;
  --line: #D3DAE1;
  --frame: #E9EDF2;
  --c-reason: #5F52C4;
  --c-control: #0D7A84;
  --c-memory: #A96A12;
  --c-tool: #B8405F;
  --c-base: #3C8553;
  --focus: #1B66D6;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161C; --surface: #19222B; --ink: #E7EDF2; --muted: #97A5B3; --line: #2D3A47; --frame: #151D25;
    --c-reason: #9D93F0; --c-control: #45B8C2; --c-memory: #E0A44A; --c-tool: #EC7F9B; --c-base: #6FC088; --focus: #7FB0FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161C; --surface: #19222B; --ink: #E7EDF2; --muted: #97A5B3; --line: #2D3A47; --frame: #151D25;
  --c-reason: #9D93F0; --c-control: #45B8C2; --c-memory: #E0A44A; --c-tool: #EC7F9B; --c-base: #6FC088; --focus: #7FB0FF;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-bottom: 10px; }
.top h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.keys { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 16px; }
.diagram { min-width: 0; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; overflow: auto; }
.diagram svg { display: block; width: 100%; height: 100%; }
.panel { min-width: 0; min-height: 0; overflow-y: auto; padding: 4px 4px 12px; }

/* diagram */
.col-frame { fill: var(--frame); stroke: var(--line); }
.col-frame.on { stroke-width: 2; }
.col-head { cursor: pointer; }
.col-head rect { fill: var(--surface); stroke: var(--line); }
.col-head text { font-size: 14px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.col-head.on rect { stroke-width: 2; }
.base-label { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.node { cursor: pointer; transition: opacity .15s; }
.node rect { stroke-width: 1.4; }
.node .ko { font-size: 13.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
.node .en { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.node.agent rect { fill: var(--ink); stroke: var(--ink); }
.node.agent .ko { fill: var(--bg); }
.node.agent .en { fill: var(--bg); opacity: .75; }
.node.sel rect { stroke-width: 3; stroke: var(--ink); }
.node.agent.sel rect { stroke: var(--focus); }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .55; transition: opacity .15s; }
.head { fill: var(--muted); opacity: .55; transition: opacity .15s; }
svg.has-sel .node:not(.on) { opacity: .16; }
svg.has-sel .edge:not(.on) { opacity: .07; }
svg.has-sel .head:not(.on) { opacity: .07; }
svg.has-sel .edge.on { opacity: .9; stroke: var(--ink); stroke-width: 1.6; }
svg.has-sel .head.on { opacity: .9; fill: var(--ink); }
svg.has-sel .edge.direct { stroke: var(--focus); stroke-width: 2.6; opacity: 1; }
svg.has-sel .head.direct { fill: var(--focus); opacity: 1; }

/* panel */
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; }
.panel h2 { font-size: 28px; line-height: 1.25; margin: 6px 0 2px; letter-spacing: -0.02em; text-wrap: balance; }
.panel .en-name { font-family: var(--mono); font-size: 14px; color: var(--muted); }
.panel .impl { font-size: 13px; color: var(--muted); margin-top: 2px; }
.panel .lead { font-size: 17px; margin: 14px 0 18px; max-width: 34em; }
.panel h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 20px 0 8px; }
.inlist, .outlist, .flow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.incard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.incard .from { font-size: 12.5px; color: var(--muted); }
.incard .carry { font-size: 16px; font-weight: 600; margin: 2px 0 4px; }
.incard .why { font-size: 14.5px; }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: inherit; }
.outitem { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.outitem .key { font-size: 16px; font-weight: 600; }
.outitem .to { font-size: 13px; color: var(--muted); }
.flow button {
  width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  display: flex; align-items: baseline; gap: 10px;
}
.flow .n { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 1.4em; }
.flow .k { font-weight: 600; }
.flow .e { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.nav { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.how { margin: 0; padding-left: 1.2em; }
.how li { margin: 4px 0; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 22px; max-width: 40em; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .diagram svg { min-width: 720px; height: auto; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { .node, .edge, .head { transition: none; } }
</style>

    });
    COLS.forEach(function (c) {
      var act = state.section === c.id;
      frameEls[c.id].setAttribute("class", "col-frame" + (act ? " on" : ""));
      frameEls[c.id].setAttribute("style", act ? "stroke:var(--c-" + c.id + ")" : "");
      headEls[c.id].setAttribute("class", "col-head" + (act ? " on" : ""));
    });
    document.getElementById("tab-all").setAttribute("aria-pressed", !state.section && !state.node ? "true" : "false");
    SEC_ORDER.forEach(function (s) { document.getElementById("tab-" + s).setAttribute("aria-pressed", state.section === s ? "true" : "false"); });
    renderPanel();
  }

  function seq() { return state.section ? SECTIONS[state.section].seq : ALL; }

  function renderPanel() {
    var h = "";
    if (state.node) {
      var n = byId[state.node], s = seq(), idx = s.indexOf(n.id);
      var ins = EDGES.filter(function (e) { return e.t === n.id; }), outs = EDGES.filter(function (e) { return e.f === n.id; });
      var secName = state.section ? SECTIONS[state.section].ko : "전체";
      var secColor = state.section ? SECTIONS[state.section].color : "var(--muted)";
      h += '<div class="eyebrow"><span class="dot" style="background:' + secColor + '"></span>' + esc(secName) + (idx >= 0 ? " · " + (idx + 1) + " / " + s.length : "") + "</div>";
      h += "<h2>" + esc(n.ko) + '</h2><div class="en-name">' + esc(n.en) + "</div>";
      if (n.impl) h += '<div class="impl">' + esc(n.impl) + "</div>";
      h += '<p class="lead">' + esc(n.sum) + "</p>";
      if (ins.length) {
        h += "<h3>이전 노드에서 이어받은 것</h3><ul class=\"inlist\">";
        ins.forEach(function (e) {
          var f = byId[e.f];
          h += '<li class="incard"><div class="from"><button class="linkbtn" data-node="' + f.id + '">' + esc(f.ko) + "</button> " + esc(f.en) + " 에서</div>" +
            '<div class="carry">' + esc(e.carry) + '</div><div class="why">' + esc(e.why) + "</div></li>";
        });
        h += "</ul>";
      } else h += "<h3>출발점</h3><p>이 다이어그램의 뿌리입니다. 위의 모든 것이 여기서 시작합니다.</p>";
      if (outs.length) {
        h += "<h3>다음으로 넘기는 키워드</h3><ul class=\"outlist\">";
        outs.forEach(function (e) {
          var t = byId[e.t];
          h += '<li class="outitem"><span class="key">' + esc(e.key) + '</span><span class="to">→ <button class="linkbtn" data-node="' + t.id + '">' + esc(t.ko) + "</button> " + esc(t.en) + "</span></li>";
        });
        h += "</ul>";
      } else h += "<h3>도착점</h3><p>네 기둥의 흐름이 모두 여기로 모입니다.</p>";
      h += '<div class="nav"><button class="btn" id="prev"' + (idx <= 0 ? " disabled" : "") + '>← 이전</button>' +
        '<button class="btn primary" id="next"' + (idx < 0 || idx >= s.length - 1 ? " disabled" : "") + ">다음 →</button>" +
        '<button class="btn" id="back">' + (state.section ? esc(secName) + " 흐름 보기" : "전체 보기") + "</button></div>";
    } else if (state.section) {
      var S = SECTIONS[state.section];
      h += '<div class="eyebrow"><span class="dot" style="background:' + S.color + '"></span>섹션</div>';
      h += "<h2>" + esc(S.ko) + '</h2><p class="lead">' + esc(S.desc) + "</p>";
      h += "<h3>이 섹션의 흐름 (아래에서 위로)</h3><ol class=\"flow\">";
      S.seq.forEach(function (id, k) {
        var m = byId[id];
        h += '<li><button data-node="' + id + '"><span class="n">' + (k + 1) + '</span><span class="k">' + esc(m.ko) + '</span><span class="e">' + esc(m.en) + "</span></button></li>";
      });
      h += '</ol><div class="nav"><button class="btn primary" id="start">이 섹션 발표 시작 →</button><button class="btn" id="back">전체 보기</button></div>';
    } else {
      h += '<div class="eyebrow">전체 보기</div><h2>LLM의 성질에서 범용 에이전트까지</h2>';
      h += '<p class="lead">맨 아래 LLM에서 출발해, 아래 것이 위 것의 재료가 되는 순서로 읽습니다. 네 기둥은 각 요소가 주로 하는 일이고, 경계에 걸친 요소는 양쪽에 속합니다.</p>';
      h += "<h3>보는 방법</h3><ul class=\"how\"><li>기둥 이름이나 위쪽 탭을 누르면 그 기둥에 속하거나 걸친 요소만 남습니다.</li>" +
        "<li>요소를 누르면 그 요소로 이어지는 경로와 거기서 뻗어 나가는 경로만 남고, 설명이 여기에 나옵니다.</li>" +
        "<li>← → 키로 순서대로 넘기고, Esc로 전체 보기로 돌아옵니다.</li></ul>";
      h += "<h3>섹션</h3><ol class=\"flow\">";
      SEC_ORDER.forEach(function (s, k) {
        h += '<li><button data-section="' + s + '"><span class="n">' + (k + 1) + '</span><span class="k">' + esc(SECTIONS[s].ko) + '</span><span class="e">' + SECTIONS[s].seq.length + "개 요소</span></button></li>";
      });
      h += '</ol><div class="nav"><button class="btn primary" id="start">처음부터 발표 시작 →</button></div>';
      h += '<p class="note">화살표는 시간 순서가 아니라 재료 관계입니다. 아래 것이 위 것의 재료가 된다는 뜻이며, 나온 시기는 반대인 경우도 있습니다. 연결선은 설명을 위한 해석이라 문헌에서 확인되는 계승 관계와 다를 수 있습니다.</p>';
    }
    panel.innerHTML = h;
    panel.scrollTop = 0;
    Array.prototype.forEach.call(panel.querySelectorAll("[data-node]"), function (b) {
      b.addEventListener("click", function () { selectNode(b.getAttribute("data-node"), true); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-section]"), function (b) {
      b.addEventListener("click", function () { selectSection(b.getAttribute("data-section")); });
    });
    var st = document.getElementById("start"); if (st) st.addEventListener("click", function () { selectNode(seq()[0], true); });
    var pv = document.getElementById("prev"); if (pv) pv.addEventListener("click", function () { step(-1); });
    var nx = document.getElementById("next"); if (nx) nx.addEventListener("click", function () { step(1); });
    var bk = document.getElementById("back"); if (bk) bk.addEventListener("click", function () { if (state.node && state.section) { state.node = null; paint(); } else clearSel(); });
  }

  function selectSection(s) { state.section = s; state.node = null; paint(); }
  function selectNode(id, keepSection) {
    if (state.section && SECTIONS[state.section].seq.indexOf(id) < 0) state.section = null;
    state.node = id; paint();
  }
  function clearSel() { state.section = null; state.node = null; paint(); }
  function step(d) {
    var s = seq();
    if (!state.node) { if (d > 0) selectNode(s[0], true); return; }
    var idx = s.indexOf(state.node), nxt = idx + d;
    if (idx < 0 || nxt < 0 || nxt >= s.length) return;
    state.node = s[nxt]; paint();
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if (ev.key === "ArrowRight") { ev.preventDefault(); step(1); }
    else if (ev.key === "ArrowLeft") { ev.preventDefault(); step(-1); }
    else if (ev.key === "Escape") { if (state.node && state.section) { state.node = null; paint(); } else clearSel(); }
  });
  paint();
})();
</script>
