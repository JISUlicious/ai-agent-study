<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent 구성요소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --outer:#C9CACC; --slide:#EDEDEA; --ink:#1A1A18; --muted:#55554F; --body:#3A3A36;
  --accent:#F0591E; --soft:#E0E0DB; --line:#1A1A18;
  --font:'Space Grotesk','Noto Sans KR',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --s:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--outer);color:var(--ink);font-family:var(--font);overflow:hidden}
/* 한국어 줄바꿈은 어절 단위로("되풀/이함"처럼 낱말 안에서 끊지 않게) */
body{word-break:keep-all;overflow-wrap:break-word}
#stage{position:fixed;inset:0}
.slide{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;background:var(--slide);
  padding:56px 80px 60px;display:flex;flex-direction:column;justify-content:space-between;visibility:hidden;transform:scale(var(--s))}
.slide.on{visibility:visible}

/* 머리와 꼬리 */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex:none}
.sh h2{margin:0 0 14px;font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1.15}.meta{margin-bottom:20px;display:flex;align-items:center;gap:14px;font-size:16px;font-weight:500;color:var(--muted);white-space:nowrap}
.meta .chk{font-size:13px;border:1.5px dashed var(--muted);border-radius:999px;padding:2px 10px}
.body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 0}
.sf{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex:none;min-height:56px}
.note{display:flex;flex-direction:column;gap:14px}
.note i{display:block;width:48px;height:3px;background:var(--accent)}
.note p{margin:0;max-width:800px;font-size:22px;line-height:1.5;color:var(--body);text-wrap:pretty}
.side-info{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:15px;color:var(--muted);text-align:right;max-width:400px;flex:none}
.legend{display:flex;gap:22px;flex-wrap:wrap;justify-content:flex-end}
.legend span{display:flex;align-items:center;gap:8px}
.legend b{display:inline-block;width:32px;border-top:2px solid var(--line)}
.legend b.dash{border-top-style:dashed}

/* 알약 노드 */
.pill{border:2px solid var(--line);border-radius:999px;padding:0 26px;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px;background:var(--slide)}
.pill .t{font-size:22px;font-weight:500;line-height:1.2}
.pill .c{font-size:15px;color:var(--muted);line-height:1.3}
.pill.key{background:var(--accent);border-color:var(--accent)}
.pill.key .t{font-weight:700}
.pill.key .c{color:#2B1A12}
.pill.prob:not(.key) .t{color:var(--accent);font-weight:700}

/* 화살표 */
.arr{display:flex;align-items:center}
.arr b{flex:1;border-top:2px solid var(--line)}
.arr.dash b{border-top-style:dashed}
.arr .hd{width:0;height:0;border-left:11px solid var(--line);border-top:7px solid transparent;border-bottom:7px solid transparent}
.arr.w48{width:48px;flex:none}

/* 관계 그래프 */
.hub{display:flex;align-items:stretch;justify-content:center;width:100%}
.hub .col{position:relative;display:flex;flex-direction:column;justify-content:center;gap:var(--gap);width:310px;flex:none}
.hub .col .pill{height:var(--ph)}
.hub .arrows{display:flex;flex-direction:column;justify-content:center;gap:var(--gap);flex:1;min-width:56px}
.hub .arrows.fixed{flex:0 0 120px}
.hub .arrows .arr{height:var(--ph);flex:none}
.hub .center{flex:none;min-width:250px;max-width:340px;border-radius:44px;padding:20px 32px}
.hub .center .t{font-size:30px;letter-spacing:-.01em}
.ccap{position:absolute;top:-30px;left:6px;font-size:15px;color:var(--muted);font-weight:500}
.hub .col.grp{width:350px;gap:0;padding:20px;background:var(--soft);border-radius:34px}
.varr{height:30px;flex:none;display:flex;flex-direction:column;align-items:center}
.varr b{flex:1;border-left:2px solid var(--line)}
.varr i{width:0;height:0;border-top:10px solid var(--line);border-left:7px solid transparent;border-right:7px solid transparent}
.chips{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:34px;font-size:16px;color:var(--muted)}
.chips .crow{display:flex;gap:10px;flex-wrap:wrap}
.chips span{border:1.5px solid var(--muted);border-radius:999px;padding:4px 14px;color:var(--ink)}
.stackv{display:flex;flex-direction:column;align-items:center;width:100%}

/* 흐름 */
.flow{display:flex;align-items:flex-start;width:100%}
.flow .step{display:flex;flex-direction:column;align-items:center;gap:12px;flex:none}
.flow .step .pill{height:72px;align-items:center;padding:0 26px}
.flow .step .pill .t{font-size:23px;font-weight:700;text-align:center;white-space:nowrap}
.flow .cap{font-size:15px;color:var(--muted);text-align:center;line-height:1.4;max-width:220px}
.flow .link{flex:1;min-width:26px;height:72px}
.flow.dense .step .pill{height:62px;padding:0 18px}
.flow.dense .step .pill .t{font-size:19px}
.flow.dense .link{height:62px}
.flows{display:flex;flex-direction:column;gap:46px;width:100%}
.frow{display:flex;align-items:flex-start;gap:24px}
.flab{width:210px;flex:none;height:72px;display:flex;align-items:center;font-size:19px;font-weight:700;color:var(--muted)}

/* 짝 */
.pairs{display:flex;flex-direction:column;gap:22px;width:100%}
.prow{display:flex;align-items:center}
.prow .pill{height:80px;flex:none}
.prow .pa{width:380px}
.prow .pb{min-width:380px;max-width:520px}
.prow .arr{flex:1;height:80px}
.pairs.grid{display:grid;grid-template-columns:380px 1fr 400px;gap:22px 0;align-items:center}
.pairs.grid .pill,.pairs.grid .arr{height:80px}
.pairs.grid .pb.span{height:auto;align-self:stretch;border-radius:44px}

/* 카드 */
.cards{display:grid;gap:20px;width:100%}
.card{border:2px solid var(--line);border-radius:28px;padding:22px 26px;display:flex;flex-direction:column;gap:8px;min-height:118px;justify-content:center}
.card .t{font-size:24px;font-weight:700;line-height:1.2}
.card .c{font-size:17px;color:var(--muted);line-height:1.45}
.card.key{background:var(--accent);border-color:var(--accent)}
.card.key .c{color:#2B1A12}
.cardrows{display:flex;flex-direction:column;gap:20px;width:100%}
.cardrow{display:flex;gap:20px;justify-content:center}
.cardrow .card{flex:none}

/* 표 */
.tblwrap{width:100%;display:flex;flex-direction:column;gap:18px}
.jt{width:100%;border-collapse:collapse;table-layout:fixed}
.jt th,.jt td{border-top:2px solid var(--line);padding:16px 18px;text-align:left;vertical-align:top;font-size:19px;line-height:1.45}
.jt tr:last-child th,.jt tr:last-child td{border-bottom:2px solid var(--line)}
.jt tr:first-child th{font-size:17px;color:var(--muted);font-weight:500}
.jt .rh{width:250px;font-size:20px;font-weight:700}
.jt .corner{width:250px}
.tfoot2{font-size:17px;color:var(--muted);line-height:1.5}
.jt.compact th,.jt.compact td{padding:11px 16px}

/* 코드 */
.cwrap{display:flex;gap:28px;width:100%;align-items:center}
.duo{display:flex;gap:40px;width:100%}
.dcol{flex:1;display:flex;flex-direction:column;gap:18px}
.dcol .pill{align-self:stretch;min-height:80px}
.dfoot{font-size:15px;color:var(--muted);line-height:1.4}
.cblk{display:flex;flex-direction:column;min-width:0}
.cblk.grow{flex:1 1 0}
.cblk.fix{flex:none}
.cblk .lab{font-size:15px;color:var(--muted);margin:0 0 8px 6px;font-weight:500}
.code{font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0;font-family:var(--mono);font-size:17px;line-height:1.6;background:var(--soft);border-radius:20px;padding:20px 26px;white-space:pre;color:var(--ink);margin:0;overflow:hidden}
.code.wrap{white-space:normal;line-height:1.4;padding:18px 24px}
.code.wrap .ln{white-space:pre-wrap;padding-left:2ch;text-indent:-2ch}
.code.wrap .ln.gap{height:.6em}
.code .k{color:#B8380A;font-weight:500}
.code .m{color:var(--muted)}
.aside{display:flex;flex-direction:column;gap:16px;width:300px;flex:none}
.aside .pill{height:76px}

/* 대화 */
.chat{display:flex;flex-direction:column;gap:26px;width:100%;max-width:1000px}
.bubble{border:2px solid var(--line);border-radius:28px;padding:20px 28px;font-size:25px;line-height:1.5;max-width:760px}
.bubble.a{align-self:flex-end;background:var(--soft);border-color:var(--soft)}
.bubble .lab{display:block;font-size:15px;color:var(--muted);margin-bottom:6px}

/* 토큰 */
.tok{display:flex;flex-direction:column;gap:30px;width:100%}
.trow{display:flex;align-items:center;gap:14px}
.ctx{display:flex;gap:6px;width:420px;flex:none;justify-content:flex-end}
.ctx span{border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:21px;white-space:pre;background:var(--slide)}
.ctx span.new{background:var(--accent);border-color:var(--accent);font-weight:700}
.llm{height:60px;padding:0 22px;align-items:center}
.probs{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:10px;font-size:19px}
.bar .w{width:76px;text-align:right}
.bar i{display:block;height:14px;background:var(--muted);border-radius:7px}
.bar.pick .w{font-weight:700}
.bar.pick i{background:var(--accent)}
.bar .p{font-family:var(--mono);font-size:15px;color:var(--muted)}
.tfoot{font-size:15px;color:var(--muted);align-self:flex-end}

/* 층 */
.layers{display:flex;align-items:stretch;height:240px}
.layers .center{width:200px;flex:none;border-radius:44px;justify-content:center;padding:0 28px}
.layers .center .t{font-size:28px}
.layers .arrows{display:flex;flex-direction:column;justify-content:center;gap:40px;flex:0 0 80px}
.layers .arrows .arr{height:90px}
.lrows{display:flex;flex-direction:column;justify-content:center;gap:40px}
.lrow{display:flex;align-items:center;gap:16px;height:90px}
.llab{width:110px;display:flex;flex-direction:column;gap:2px}
.llab b{font-size:32px;line-height:1}
.llab span{font-size:15px;color:var(--muted)}
.lrow .pill{height:72px;width:160px;align-items:center;padding:0 12px}
.lrow .pill .t{font-size:20px;font-weight:500}

/* 수식 */
.eq{display:flex;flex-direction:column;align-items:center;gap:34px}
.eqrow{display:flex;align-items:center;gap:16px}
.eqrow .pill{height:72px;align-items:center}
.eqrow .op{font-size:34px;font-weight:500;color:var(--muted)}
.eqrow .big{height:96px;border-radius:48px;padding:0 44px}
.eqrow .big .t{font-size:34px}
.eqrow .dim{opacity:.38}
.eqrow .pill.dim{border-style:dashed}
.eqex{display:flex;gap:24px}
.eqex .pill{height:82px;width:470px}
.eqex .pill.alt{border-style:dashed}

/* 캔버스 다이어그램 */
.cv{position:relative;width:1120px;flex:none}
.floatlg{position:absolute;right:80px;bottom:26px}
.ctext.lgd{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.ctext.lgd::before{content:'';width:28px;border-top:2px dashed var(--line)}
.cvs{position:absolute;left:0;top:0;overflow:visible}
.cvs path,.cvs line{fill:none;stroke:var(--line);stroke-width:2}
.cvs .dash{stroke-dasharray:7 6}
.cvs .el{font:500 14px var(--font);fill:var(--muted);stroke:var(--slide);stroke-width:6px;paint-order:stroke;text-anchor:middle}
.cvs .track{fill:none;stroke:var(--line);stroke-width:2}
.cvs .lh{fill:var(--line);stroke:none}
.cbox{position:absolute;border:2px solid var(--line);border-radius:24px}
.cbox span{position:absolute;left:16px;top:8px;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.cbox.sub{border-style:dashed;border-radius:18px}
.cbox.sm{border-radius:14px}
.cbox.sm span{left:10px;top:3px;font-size:12px}
.cnode{position:absolute;padding:0 12px;align-items:center;text-align:center;min-height:0}
.cnode .t{font-size:15px;font-weight:600}
.cnode .c{font-size:13px}
.cnode.big .t{font-size:24px;font-weight:700}
.cnode.big .c{font-size:15px}
.cnode.mid .t{font-size:18px}
.cnode.hk{gap:0;padding:0 8px}
.cnode.hk .t{font-size:16px;font-weight:700}
.cnode.hk .c{font-size:12px;white-space:nowrap}
.cnode.sm{padding:0 4px;gap:0}
.cnode.sm .t{font-size:12px;font-weight:500;white-space:nowrap;line-height:1.15}
.cnode.rc{border-radius:6px}
.cnode.ov{border-radius:50%}
.cnode.db{border-radius:50%/24%}
.cnode.dia{border:none;background:none}
.cnode.dia::before,.cnode.dia::after{content:'';position:absolute;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.cnode.dia::before{inset:0;background:var(--line)}
.cnode.dia{background:none !important}
.cnode.dia::after{inset:3px 4px;background:var(--fill,var(--slide))}
.cnode.dia .t{position:relative;z-index:1}
.ctext{position:absolute;white-space:nowrap}
.ctext.ct{font-size:22px;font-weight:700}
.ctext.cc{font-size:15px;color:var(--muted)}
.ap{position:absolute;transform:translate(-50%,-50%);min-height:72px;align-items:center;text-align:center;padding:9px 20px}
.ap .t{font-size:22px;font-weight:700;white-space:nowrap}
.ap.hk{width:126px;min-height:0;height:52px;padding:0 10px;gap:0;z-index:1}
.ap.hk .t{font-size:16px}
.ap.hk .c{font-size:13px;white-space:nowrap}
.lp{position:relative;width:1120px;flex:none}

/* 시퀀스 */
.sq{position:relative;width:900px;flex:none}
.sq .head{position:absolute;top:0;width:220px;height:48px;align-items:center;transform:translateX(-50%)}
.sq .head .t{font-size:19px;font-weight:700}
.sq .ml{font:500 15px var(--mono);fill:var(--ink);text-anchor:middle;stroke:var(--slide);stroke-width:6px;paint-order:stroke}
.sq .ml .md{font-family:var(--font);fill:var(--muted)}
.sq .life{stroke:var(--muted);stroke-dasharray:4 5;stroke-width:1.5}
.sq .ret{stroke-dasharray:7 6}
.sq line.key{stroke:var(--accent);stroke-width:2.5}
.sq .ml.key{fill:var(--accent);font-weight:700}
.sq .ml.key .md{fill:var(--ink);font-weight:500}

/* Transformer */
.attn{display:flex;align-items:center;gap:44px;width:100%}
.stk{display:flex;flex-direction:column;align-items:stretch;width:330px;flex:none;position:relative}
.blk{border:2px solid var(--line);border-radius:14px;height:50px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;background:var(--slide);text-align:center;padding:0 10px}
.blk.key{background:var(--accent);border-color:var(--accent);font-weight:700}
.conn{height:14px;width:2px;background:var(--line);align-self:center}
.layer{position:relative;display:flex;flex-direction:column;align-items:stretch}
.pair{display:flex;gap:20px}
.col2{flex:1;display:flex;flex-direction:column}
.blk.pe{font-size:15px;line-height:1.15}
.rep{position:absolute;right:-56px;top:0;bottom:0;width:22px;border:2px solid var(--muted);border-left:none;border-radius:0 10px 10px 0}
.rep span{position:absolute;left:30px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted);white-space:nowrap}
.callouts{flex:1;display:flex;flex-direction:column;gap:16px;padding-left:96px}
.co .t{font-size:21px;font-weight:700}
.co .c{font-size:16px;color:var(--muted);line-height:1.4}
.cfoot{font-size:15px;color:var(--muted);border-top:1.5px solid var(--muted);padding-top:10px;margin-top:6px}
.agrid{display:grid;grid-template-columns:repeat(8,18px);gap:3px}
.agrid i{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:3px}
.agrid i.f{background:var(--ink);border-color:var(--ink)}
.gcap{font-size:15px;color:var(--muted);margin-top:10px;text-align:center}

/* Context window 막대 */
.cwin{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.clg{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;font-size:15px;color:var(--muted)}
.clg span{display:flex;align-items:center;gap:8px}
.clg .cs{position:static;display:inline-block;width:24px;height:14px}
.crows{position:relative;display:flex;flex-direction:column;gap:18px;padding-top:32px}
.crow{display:flex;align-items:center;gap:16px}
.clab{width:60px;flex:none;font-size:18px;font-weight:700;text-align:right}
.cbar{position:relative;height:44px;flex:none}
.cs{position:absolute;top:0;height:100%}
.cs.sys{background:#55554F}
.cs.doc{background:#A8A8A2}
.cs.hist{background:#D2D2CC}
.cs.think{background:repeating-linear-gradient(45deg,#D2D2CC 0 6px,#EDEDEA 6px 12px);box-shadow:inset 0 0 0 1.5px #A8A8A2}
.cs.out{background:#FFFFFF;box-shadow:inset 0 0 0 2px var(--line)}
.cs.over{background:var(--accent)}
.cover{position:absolute;top:50%;transform:translateY(-50%);font-size:17px;font-weight:700;color:#B8380A;white-space:nowrap}
.climit{position:absolute;top:0;bottom:-10px;left:calc(76px + var(--lx));border-left:2px dashed var(--line)}
.climit span{position:absolute;top:2px;left:10px;font-size:15px;font-weight:500;white-space:nowrap}
.ceq{font-size:19px;color:var(--body)}
.cgen{position:relative;display:flex;flex-direction:column;align-items:center}
.grow{display:flex;align-items:center}
.gseq{display:flex;gap:6px}
.gseq span,.gnext{border:2px solid #D2D2CC;background:#D2D2CC;border-radius:10px;padding:5px 9px;font-size:18px;white-space:pre}
.gseq span.o{background:#FFFFFF;border-color:var(--line)}
.gnext{background:var(--accent);border-color:var(--accent);font-weight:700}
.gllm{height:48px;padding:0 20px}
.gback{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.gloop{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.gcap{margin-top:26px;font-size:15px;color:var(--muted)}
.ceq .k{color:#B8380A;font-weight:700}

/* 곡선 */
.curve{display:flex;align-items:center;gap:56px;width:100%}
.curve svg text{font-family:var(--font)}
.cside{flex:1;display:flex;flex-direction:column;gap:14px}
.cside h3{margin:0 0 4px;font-size:26px}
.cside div{font-size:19px;line-height:1.45;padding-left:18px;position:relative}
.cside div::before{content:"";position:absolute;left:0;top:12px;width:8px;height:2px;background:var(--line)}

/* 제목, 목차 */
.title-slide{padding:72px 80px;justify-content:space-between}
.title-slide .kicker,.title-slide .by{font-size:17px;font-weight:500;color:var(--muted)}
.title-slide .tl{display:flex;flex-direction:column;gap:24px}
.title-slide .bar{width:120px;height:4px;margin-bottom:12px;background:var(--accent)}
.title-slide h1{margin:0;font-size:84px;line-height:1.12;font-weight:700;letter-spacing:-.03em}
.title-slide .sub{font-size:24px;color:var(--muted)}
.toc{display:grid;grid-template-columns:1fr 1fr;gap:56px;width:100%;align-self:center}
.toc a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 2px;border-top:2px solid var(--line);color:var(--ink);text-decoration:none;font-size:22px;font-weight:500;cursor:pointer}
.toc a:last-child{border-bottom:2px solid var(--line)}
.toc a span:last-child{font-size:16px;color:var(--muted);font-family:var(--mono)}
.toc a:hover span:first-child{color:#B8380A}

/* 조작 */
#hud{position:fixed;right:14px;bottom:12px;display:flex;align-items:center;gap:6px;font-size:13px;color:#3A3A36;z-index:5}
#hud button{font:inherit;border:1px solid #8E8F92;background:#E4E4E1;border-radius:8px;padding:4px 10px;cursor:pointer;color:#1A1A18;min-width:34px;min-height:30px}
#hud button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hud button[aria-pressed="true"]{background:#F6CDB9;border-color:var(--accent)}
/* 리허설 모드: 장마다 30초 줄어드는 아래 선, 오른쪽에 남긴 · 넘긴 시간 게이지 */
#rh{position:fixed;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform:scale(var(--s));pointer-events:none;z-index:4;display:none}
#rh.on{display:block}
#rh .line{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);opacity:.55;transform-origin:left center}
#rhb{position:fixed;right:0;top:0;bottom:0;width:3px;pointer-events:none;z-index:4;display:none}
#rhb i{position:absolute;left:0;right:0}
#rhb .pos{bottom:50%;background:var(--accent);opacity:.45}
#rhb .neg{top:50%;background:var(--accent);opacity:.45}
#rhv{position:fixed;right:8px;bottom:48px;font:500 11px var(--mono);color:#8E8F92;pointer-events:none;z-index:4;display:none}
body.rh #rhb,body.rh #rhv{display:block}
#cnt{min-width:58px;text-align:center;font-family:var(--mono)}
#list{position:fixed;inset:0;background:rgba(26,26,24,.55);display:none;align-items:center;justify-content:center;z-index:10}
#list.open{display:flex}
#list .box{background:var(--slide);border-radius:16px;padding:20px 24px;width:min(860px,94vw);max-height:86vh;overflow:auto;columns:2;column-gap:28px}
#list button{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:14px;background:none;border:none;padding:5px 4px;cursor:pointer;color:var(--ink);break-inside:avoid}
#list button span{font-family:var(--mono);color:var(--muted);min-width:24px}
#list button:hover{background:var(--soft)}

@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #stage{position:static}
  .slide{position:relative;left:auto;top:auto;margin:0;transform:none;visibility:visible;break-after:page;page-break-after:always}
  #hud,#list,#rh,#rhb,#rhv{display:none!important}
  @page{size:1280px 720px;margin:0}
}

/* ---------- 쪽 번호 ---------- */
/* 섹션 이름(sec)이나 장 제목으로 쪽을 찾습니다. 본문에는 ⟨첫|끝⟩ 꼴로 적으면 그릴 때 "31–40"처럼 바뀝니다.
   장을 더하거나 옮겨도 목차와 본문의 쪽 표시가 맞습니다. 못 찾으면 "?"로 둡니다 */
const SECP={}, TITLEP={};
S.forEach((s,i)=>{ const p=i+1; if(s.title && !TITLEP[s.title]) TITLEP[s.title]=p; if(s.sec){ const r=SECP[s.sec]||(SECP[s.sec]=[p,p]); r[1]=p; } });
function pageSpan(a,b=a){
  const x=SECP[a]?SECP[a][0]:TITLEP[a], y=SECP[b]?SECP[b][1]:TITLEP[b];
  if(!x||!y){ console.warn('쪽 참조를 찾지 못함:', a, b); return ['?','?']; }
  return [x,y];
}
const pageRefs = h => h.replace(/⟨([^⟩|]+)(?:\|([^⟩]+))?⟩/g, (_,a,b)=>{ const [x,y]=pageSpan(a,b||a); return x===y?`${x}`:`${x}–${y}`; });

/* ---------- 그리기 ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const br = s => esc(s).replace(/\n/g,'<br>');
const hl = s => esc(s).replace(/⟦(.*?)⟧/g,'<span class="k">$1</span>').replace(/⟪(.*?)⟫/g,'<span class="m">$1</span>');
const pill = (d, cls='', style='') =>
  `<div class="pill${d.key?' key':''}${d.prob?' prob':''}${cls?' '+cls:''}"${style?` style="${style}"`:''}><div class="t">${br(d.t)}</div>${d.c?`<div class="c">${br(d.c)}</div>`:''}</div>`;
const arrow = (dash, cls='', plain=false) => `<div class="arr${dash?' dash':''}${cls?' '+cls:''}"><b></b>${plain?'':'<i class="hd"></i>'}</div>`;

function hub(s){
  const L=s.left||[], R=s.right||[], n=Math.max(L.length,R.length,1);
  const ph = n>=4 ? 70 : 76, gap = n>=4 ? 16 : 18;
  /* rgroup: 오른쪽이 가운데 노드 안의 단계일 때. 단계를 상자 하나로 묶고, 가운데에서 상자로 가는 화살표는 하나만 둡니다 */  const VG = 30, PAD = 20;
  const H = s.rgroup ? Math.max(L.length*ph+(L.length-1)*gap, R.length*ph+(R.length-1)*VG+2*PAD) : n*ph+(n-1)*gap;
  let h=`<div class="hub" style="height:${H}px;--ph:${ph}px;--gap:${gap}px">`;
  if(L.length) h+=`<div class="col">${s.lcap?`<div class="ccap">${esc(s.lcap)}</div>`:''}${L.map(d=>pill(d)).join('')}</div>`+
    `<div class="arrows${R.length?'':' fixed'}">${L.map(()=>arrow(s.leftStyle==='dash')).join('')}</div>`;
  /* 묶음 상자가 더 높아도 가운데 노드는 다른 hub 장과 같은 높이로 둡니다 */
  h+=pill({...s.center,key:1},'center', s.rgroup?`align-self:center;height:${n*ph+(n-1)*gap}px`:'');
  if(R.length && s.rgroup) h+=`<div class="arrows${L.length?'':' fixed'}">${arrow(s.rightStyle==='dash')}</div>`+
    `<div class="col grp"${s.rloop?` data-loop="${s.rloop.join(',')}"`:''}>${s.rcap?`<div class="ccap">${esc(s.rcap)}</div>`:''}${R.map((d,i)=>(i?'<div class="varr"><b></b><i></i></div>':'')+pill(d)).join('')}${s.rloop?'<svg class="gloop" aria-hidden="true"></svg>':''}</div>`;
  else if(R.length) h+=`<div class="arrows${L.length?'':' fixed'}">${R.map(()=>arrow(s.rightStyle==='dash')).join('')}</div>`+
    `<div class="col">${s.rcap?`<div class="ccap">${esc(s.rcap)}</div>`:''}${R.map(d=>pill(d)).join('')}</div>`;
  h+='</div>';
  if(s.chips) h=`<div class="stackv">${h}<div class="chips"><div>${esc(s.chips.label)}:</div><div class="crow">${s.chips.items.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div></div>`;
  return h;
}
function flow(s, steps=s.steps){
  const dense = steps.length>4 || steps.some(d=>d.t.length>16);
  let h=`<div class="flow${dense?' dense':''}">`;
  steps.forEach((d,i)=>{
    if(i) h+=arrow(false,'link',!!s.plain);
    h+=`<div class="step">${pill({t:d.t,key:d.key})}${d.c?`<div class="cap">${br(d.c)}</div>`:''}</div>`;
  });
  return h+'</div>';
}
function flows(s){ return `<div class="flows">${s.rows.map(r=>`<div class="frow"><div class="flab">${esc(r.label)}</div>${flow(s,r.steps)}</div>`).join('')}</div>`; }
function pairs(s){
  const arr = r => arrow((r.style||s.style)==='dash');
  if(!s.rows.some(r=>r.b&&r.b.span)) return `<div class="pairs">${s.rows.map(r=>`<div class="prow">${pill(r.a,'pa')}${arr(r)}${pill(r.b,'pb')}</div>`).join('')}</div>`;
  /* 오른쪽 노드 하나가 여러 줄에 걸칠 때(b.span): 격자로 그리고, 걸쳐진 줄은 b를 비웁니다 */
  return `<div class="pairs grid">${s.rows.map(r=>pill(r.a,'pa')+arr(r)+(r.b?pill(r.b,'pb'+(r.b.span?' span':''),r.b.span?`grid-row:span ${r.b.span}`:''):'')).join('')}</div>`;
}
function table(s){
  const head=`<tr><th class="corner">${br(s.corner||'')}</th>${s.cols.map(c=>`<th>${br(c)}</th>`).join('')}</tr>`;
  const rows=s.rows.map(r=>`<tr><th class="rh">${br(r.h)}</th>${r.cells.map(c=>`<td>${br(c)}</td>`).join('')}</tr>`).join('');
  /* widths: 머리 열 뒤 열들의 너비, compact: 칸 안 여백을 줄임 */
  const cg = s.widths ? `<colgroup><col style="width:250px">${s.widths.map(w=>`<col style="width:${w}">`).join('')}</colgroup>` : '';
  return `<div class="tblwrap"><table class="jt${s.compact?' compact':''}">${cg}${head}${rows}</table>${s.foot?`<div class="tfoot2">${br(s.foot)}</div>`:''}</div>`;
}
function cards(s){
  const card=(d,w)=>`<div class="card${d.key?' key':''}"${w?` style="width:${w}"`:''}><div class="t">${br(d.t)}</div>${d.c?`<div class="c">${br(d.c)}</div>`:''}</div>`;
  /* rows: 줄마다 카드 수를 정하고 가운데에 맞춤(예: [3, 2]). 카드 폭은 가장 많은 줄에 맞춰 같게 둠 */
  if(s.rows){
    const n=Math.max(...s.rows), w=`calc((100% - ${(n-1)*20}px) / ${n})`; let i=0;
    return `<div class="cardrows">${s.rows.map(k=>`<div class="cardrow">${s.cards.slice(i,i+=k).map(d=>card(d,w)).join('')}</div>`).join('')}</div>`;
  }
  return `<div class="cards" style="grid-template-columns:repeat(${s.cols||3},1fr)">${s.cards.map(d=>card(d)).join('')}</div>`;
}
/* wrap: 긴 줄을 상자 안에서 접어 보입니다(접힌 줄은 2칸 들여 원래 줄과 구분). 빈 줄은 반 줄 높이로 */
const codeBlock = (label, code, fs, wrap, cls='') => `<div class="cblk${cls?' '+cls:''}">${label?`<div class="lab">${esc(label)}</div>`:''}${wrap
  ? `<div class="code wrap"${fs?` style="font-size:${fs}px"`:''}>${code.split('\n').map(l=>l?`<div class="ln">${hl(l)}</div>`:'<div class="ln gap"></div>').join('')}</div>`
  : `<pre class="code"${fs?` style="font-size:${fs}px"`:''}>${hl(code)}</pre>`}</div>`;
const aside = list => list ? `<div class="aside">${list.map(d=>pill(d)).join('')}</div>` : '';
function code(s){ return `<div class="cwrap">${codeBlock(s.label,s.code,s.fs,s.wrap,s.wrap?'grow':'')}${aside(s.aside)}</div>`; }
/* 나란히 비교: 열마다 알약 하나와 코드 블록 하나 */
function duo(s){ return `<div class="duo">${s.cols.map(c=>`<div class="dcol">${pill(c)}${codeBlock('',c.code,s.fs||18)}${c.foot?`<div class="dfoot">${br(c.foot)}</div>`:''}</div>`).join('')}</div>`; }
function code2(s){
  const [a,b]=s.blocks, fs=s.fs||18;
  /* 접는 블록은 남는 너비를 채우고, 다른 블록은 제 너비를 지킵니다 */
  const cl = (x,y) => x.wrap ? 'grow' : (y.wrap ? 'fix' : '');
  const row=`<div class="cwrap" style="justify-content:center">${codeBlock(a.label,a.code,a.fs||fs,a.wrap,cl(a,b))}${arrow(false,'w48')}${codeBlock(b.label,b.code,b.fs||fs,b.wrap,cl(b,a))}</div>`;
  if(!s.aside) return row;
  return `<div class="stackv" style="gap:30px">${row}<div style="display:flex;gap:18px;justify-content:center">${s.aside.map(d=>pill(d,'','height:76px;width:330px')).join('')}</div></div>`;
}
/* 입력 하나 → 출력 여러 개(예: 같은 지시의 성공과 실패) */
function codefan(s){

}
function codeflow(s){ return `<div style="display:flex;flex-direction:column;gap:30px;width:100%">${flow(s)}${codeBlock('',s.code,s.fs)}</div>`; }
function cardscode(s){ return `<div class="cwrap"><div style="width:330px;flex:none">${cards({cards:s.cards,cols:1})}</div>${codeBlock(s.label,s.code,17)}</div>`; }
function chat(s){ return `<div class="chat"><div class="bubble"><span class="lab">${esc(s.ql)}</span>${br(s.q)}</div><div class="bubble a"><span class="lab">${esc(s.al)}</span>${br(s.a)}</div></div>`; }
function tokens(s){
  let h='<div class="tok">';
  s.steps.forEach(st=>{
    h+='<div class="trow"><div class="ctx">'+st.ctx.map((t,i)=>`<span class="${i===st.newIdx?'new':''}">${esc(t)}</span>`).join('')+'</div>';

function layers(s){

/* items는 글자 또는 {t, dim}. dim은 꼭 필요하지 않은 요소라 흐리게(앞의 +도 함께) */
function equation(s){
  const it=s.items.map(d=>typeof d==='string'?{t:d}:d);
  const row=it.map((d,i)=>(i?`<span class="op${d.dim?' dim':''}">+</span>`:'')+pill({t:d.t},d.dim?'dim':'')).join('');
  /* ex: 식 아래 사례 알약(alt는 점선 테두리로 참고 사례 표시) */
  const ex=s.ex?`<div class="eqex">${s.ex.map(d=>pill(d,d.alt?'alt':'')).join('')}</div>`:'';
  return `<div class="eq"><div class="eqrow">${row}</div><div class="eqrow"><span class="op">=</span>${pill({t:s.result,key:1},'big')}</div>${ex}</div>`;

/* 캔버스: 노드 좌표를 정해 두고 화살표는 꺾은선으로 잇습니다 */
/* 변 이름 뒤에 '@비율'을 붙이면(예: 't@0.125') 변의 가운데 대신 그 비율 위치에서 선이 나갑니다. 한 변에서 선을 여럿 낼 때 씁니다 */
function sidePt(n, s){
  const [d,f]=s.split('@'), k=f===undefined?0.5:+f;
  if(d==='l') return [n.x, n.y+n.h*k];
  if(d==='r') return [n.x+n.w, n.y+n.h*k];
  if(d==='t') return [n.x+n.w*k, n.y];
  return [n.x+n.w*k, n.y+n.h];
}
function route(a, fs, b, ts, out=34){
  const p=sidePt(a,fs), q=sidePt(b,ts), H=s=>s[0]==='l'||s[0]==='r', pts=[p];
  if(H(fs)&&H(ts)){
    if(fs[0]===ts[0]){ const x = fs[0]==='r' ? Math.max(p[0],q[0])+out : Math.min(p[0],q[0])-out; pts.push([x,p[1]],[x,q[1]]); }
    else if(Math.abs(p[1]-q[1])>1){ const mx=(p[0]+q[0])/2; pts.push([mx,p[1]],[mx,q[1]]); }
  } else if(!H(fs)&&!H(ts)){
    if(fs[0]===ts[0]){ const y = fs[0]==='b' ? Math.max(p[1],q[1])+out : Math.min(p[1],q[1])-out; pts.push([p[0],y],[q[0],y]); }
    else if(Math.abs(p[0]-q[0])>1){ const my=(p[1]+q[1])/2; pts.push([p[0],my],[q[0],my]); }
  } else if(H(fs)) pts.push([q[0],p[1]]);
  else pts.push([p[0],q[1]]);
  pts.push(q);
  return pts;
}
function labelAt(pts){
  let best=0, at=[0,0];
  for(let i=1;i<pts.length;i++){
    const [x1,y1]=pts[i-1], [x2,y2]=pts[i], d=Math.hypot(x2-x1,y2-y1);
    if(d>best){ best=d; at=[(x1+x2)/2,(y1+y2)/2]; }
  }
  return at;
}
function canvas(s){
  const W=1120, H=s.h||380, all={};
  (s.nodes||[]).forEach(n=>all[n.id]=n); (s.boxes||[]).forEach(b=>all[b.id]=b);
  let h=`<div class="cv" style="height:${H}px${s.zoom?`;zoom:${s.zoom}`:''}">`;
  (s.boxes||[]).forEach(b=>{ h+=`<div class="cbox${b.sub?' sub':''}${b.sm?' sm':''}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"><span>${esc(b.label)}</span></div>`; });
  let svg=`<svg class="cvs" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`, labels='';
  (s.edges||[]).forEach(([a,fs,b,ts,o={}])=>{
    const pts=route(all[a],fs,all[b],ts,o.out);
    svg+=`<path d="M${pts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L')}" class="${o.dash?'dash':''}" marker-end="url(#ah)"${o.both?' marker-start="url(#ahs)"':''}/>`;
    if(o.label){ const [x,y]=labelAt(pts); labels+=`<text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" class="el">${esc(o.label)}</text>`; }
  });
  h+=svg+labels+'</svg>';
  (s.nodes||[]).forEach(n=>{ h+=`<div class="pill cnode${n.key?' key':''}${n.cls?' '+n.cls:''}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px${n.bg?`;background:${n.bg};--fill:${n.bg}`:''}"><div class="t">${br(n.t)}</div>${n.c?`<div class="c">${br(n.c)}</div>`:''}</div>`; });
  (s.texts||[]).forEach(t=>{ h+=`<div class="ctext ${t.cls||''}" style="left:${t.x}px;top:${t.y}px">${esc(t.t)}</div>`; });
  return h+'</div>';
}

/* 루프: 타원 궤도 위에 노드를 두고 노드 사이에 방향 표시 */
function loop(s){
  const W=1120, H=400, cx=560, cy=210, rx=330, ry=130, n=s.nodes.length, ty=cy-ry;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  let svg=`<svg class="cvs" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" class="track"/>`;
  /* hooks: 포인트 색으로 끼워 넣는 작은 노드. at은 'entry'·'exit'(들어오고 나가는 선 위) 또는 i(노드 i와 i+1 사이 궤도 위).
     hook이 있는 구간의 방향 표시는 hook 노드에 가리지 않게 궤도를 따라 86px 옮기고, 위쪽 선과 겹치지 않게 아래쪽을 고릅니다 */
  const hk=s.hooks||[], pt=m=>[cx+rx*Math.cos(m), cy+ry*Math.sin(m)];
  for(let i=0;i<n;i++){
    let m=ang(i)+Math.PI/n;
    if(hk.some(k=>k.at===i)){ const d=86/Math.hypot(rx*Math.sin(m), ry*Math.cos(m)); m = pt(m+d)[1] >= pt(m-d)[1] ? m+d : m-d; }
    const hx=cx+rx*Math.cos(m), hy=cy+ry*Math.sin(m);
    const deg=Math.atan2(ry*Math.cos(m), -rx*Math.sin(m))*180/Math.PI;
    svg+=`<path d="M-10,-8 L10,0 L-10,8 z" class="lh" transform="translate(${hx.toFixed(1)} ${hy.toFixed(1)}) rotate(${deg.toFixed(1)})"/>`;
  }
  if(s.entry) svg+=`<line x1="206" y1="${ty}" x2="${cx-117}" y2="${ty}" marker-end="url(#ah)"/>`;
  if(s.exit) svg+=`<line x1="${cx+117}" y1="${ty}" x2="${W-206}" y2="${ty}" marker-end="url(#ah)"/>`;
  svg+='</svg>';
  const ap=(d,x,y,w)=>`<div class="pill ap${d.key?' key':''}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;${w?`width:${w}px`:''}"><div class="t">${br(d.t)}</div>${d.c?`<div class="c">${br(d.c)}</div>`:''}</div>`;
  let h=`<div class="lp" style="height:${H}px">${svg}`;
  s.nodes.forEach((d,i)=>{ const a=ang(i); h+=ap(d, cx+rx*Math.cos(a), cy+ry*Math.sin(a), 230); });
  if(s.center) h+=ap({key:1,...s.center}, cx, cy);
  if(s.entry) h+=ap(s.entry, 103, ty, 200);
  if(s.exit) h+=ap(s.exit, W-103, ty, 200);
  hk.forEach(k=>{
    const [x,y] = k.at==='entry' ? [(206+cx-117)/2, ty] : k.at==='exit' ? [(cx+117+W-206)/2, ty] : pt(ang(k.at)+Math.PI/n);
    h+=`<div class="pill ap hk key" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px"><div class="t">${br(k.t)}</div>${k.c?`<div class="c">${br(k.c)}</div>`:''}</div>`;
  });
  return h+'</div>';
}

/* 시퀀스 */
function seq(s){
  const side=s.side, W=side?720:900, x1=side?120:170, x2=side?600:730, top=86, step=40, H=top+(s.msgs.length-1)*step+24;
  let svg=`<svg class="cvs" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`+
    `<line x1="${x1}" y1="50" x2="${x1}" y2="${H}" class="life"/><line x1="${x2}" y1="50" x2="${x2}" y2="${H}" class="life"/>`;
  /* 메시지 넷째 값 {key:1}: 그 메시지를 포인트 색으로 강조. 강조가 있으면 서버 머리 노드는 칠하지 않습니다(포인트는 한 곳) */
  const hk=s.msgs.some(m=>m[3]&&m[3].key);
  s.msgs.forEach(([d,m,txt,o={}],i)=>{
    const y=top+i*step, a=d==='>'?x1:x2, b=d==='>'?x2:x1;
    svg+=`<line x1="${a}" y1="${y}" x2="${b + (d==='>'?-2:2)}" y2="${y}" class="${d==='<'?'ret':''}${o.key?' key':''}" marker-end="url(#${o.key?'ahk':'ah'})"/>`;
    svg+=`<text x="${(x1+x2)/2}" y="${y-9}" class="ml${o.key?' key':''}">${esc(m)}${txt?`<tspan class="md">  ${esc(txt)}</tspan>`:''}</text>`;
  });
  svg+='</svg>';
  const sq=`<div class="sq" style="width:${W}px;height:${H}px">${svg}${pill({t:s.a},'head','left:'+x1+'px')}${pill({t:s.b,key:hk?0:1},'head','left:'+x2+'px')}</div>`;
  if(!side) return sq;
  return `<div class="cwrap" style="justify-content:center;gap:40px">${sq}<div style="width:330px;flex:none">${cards({cards:side,cols:1})}</div></div>`;
}

/* Transformer 블록 */
/* key: 포인트 색으로 칠할 노드(attn: Self-attention, pe: Positional encoding), grid:0이면 n×n 격자를 뺌.
   Positional encoding은 입력 embedding에 더하지 않고 attention에서 쓰이므로(RoPE), 세로 흐름에 넣지 않고
   Embedding과 나란히(너비를 반씩) 두고, 입력 토큰에서 갈라져 Self-attention에서 합쳐지게 세로 선으로만 잇습니다
   (입력 토큰 → Embedding → Self-attention, 입력 토큰 → Positional encoding → Self-attention).
   Q · K와의 세부 계산은 발표에서 다루지 않습니다 */
function attention(s){
  const k=s.key||'attn', conn='<div class="conn"></div>';
  const col=(t,c)=>`<div class="col2">${conn}<div class="blk${c}">${t}</div>${conn}</div>`;
  const stk=`<div class="stk"><div class="blk">다음 토큰 확률</div>${conn}<div class="layer"><div class="blk">Feed-forward</div>${conn}`+
    `<div class="blk${k==='attn'?' key':''}">Self-attention</div><div class="rep"><span>× N층</span></div></div>`+
    `<div class="pair">${col('Embedding','')}${col('Positional encoding',' pe'+(k==='pe'?' key':''))}</div>`+
    `<div class="blk">입력 토큰</div></div>`;
  const co=`<div class="callouts">${s.items.map(d=>`<div class="co"><div class="t">${esc(d.t)}</div><div class="c">${br(d.c)}</div></div>`).join('')}${s.foot?`<div class="cfoot">${esc(s.foot)}</div>`:''}</div>`;
  let g='';
  if(s.grid!==0){
    g='<div><div class="agrid">';
    for(let r=0;r<8;r++) for(let c=0;c<8;c++) g+=`<i class="${c<=r?'f':''}"></i>`;
    g+='</div><div class="gcap">토큰 n개 → n×n 쌍</div></div>';
  }
  return `<div class="attn">${stk}${co}${g}</div>`;
}

/* Context window 막대 (개념도): 턴마다 쌓이는 토큰과 창 한도. 한도를 넘는 부분은 포인트 색 */
function ctxbars(s){
  const W=820, sc=W/s.max, lx=s.limit*sc;
  const seg=(k,x,w)=>`<i class="cs ${k}" style="left:${(x*sc).toFixed(1)}px;width:${(w*sc).toFixed(1)}px"></i>`;
  const rows=s.rows.map(r=>{
    let x=0, h='';
    r.segs.forEach(([k,w])=>{
      const a=Math.max(0,Math.min(w,s.limit-x));
      if(a>0) h+=seg(k,x,a);
      if(w-a>0) h+=seg('over',x+a,w-a);
      x+=w;
    });
    const over=x>s.limit;
    return `<div class="crow"><div class="clab">${esc(r.label)}</div><div class="cbar" style="width:${W}px">${h}${over?`<span class="cover" style="left:${(x*sc+12).toFixed(1)}px">초과</span>`:''}</div></div>`;
  }).join('');
  const lg=`<div class="clg">${s.legend2.map(([k,t])=>`<span><i class="cs ${k}"></i>${esc(t)}</span>`).join('')}<span><i class="cs over"></i>초과분</span></div>`;
  const ex=s.aside?`<div style="display:flex;gap:18px;justify-content:center">${s.aside.map(d=>pill(d,'','height:76px;width:330px')).join('')}</div>`:'';
  /* gen: 토큰 생성 되짚기. 생성한 토큰이 입력 끝에 붙는 되돌림 화살표는 그린 뒤 drawGenBack()이 위치를 재서 그림 */
  const g=s.gen;
  const gen=g?`<div class="cgen"><div class="grow"><div class="gseq">${g.ctx.map(t=>`<span>${esc(t)}</span>`).join('')}${g.prev.map(t=>`<span class="o">${esc(t)}</span>`).join('')}</div>${arrow(false,'w48')}${pill({t:'LLM'},'llm gllm')}${arrow(false,'w48')}<span class="gnext">${esc(g.next)}</span></div><svg class="gback" aria-hidden="true"></svg><div class="gcap">${esc(g.cap)}</div></div>`:'';
  return `<div class="cwin">${gen}${lg}<div class="crows" style="--lx:${lx.toFixed(1)}px">${rows}<div class="climit"><span>${esc(s.limitLabel)}</span></div></div>${s.eq?`<div class="ceq">${hl(s.eq)}</div>`:''}${ex}</div>`;
}

/* U자 곡선 (개념도) */
function curve(s){
  const svg=`<svg width="560" height="330" viewBox="0 0 560 330" role="img" aria-label="관련 정보의 위치에 따른 정확도 개념도">
    <line x1="60" y1="30" x2="60" y2="270" stroke="#1A1A18" stroke-width="2"/>
    <line x1="60" y1="270" x2="540" y2="270" stroke="#1A1A18" stroke-width="2"/>
    <path d="M80 70 C 200 250, 400 250, 520 100" fill="none" stroke="#F0591E" stroke-width="4"/>
    <circle cx="80" cy="70" r="6" fill="#F0591E"/><circle cx="300" cy="206" r="6" fill="#F0591E"/><circle cx="520" cy="100" r="6" fill="#F0591E"/>
    <text x="80" y="296" text-anchor="middle" font-size="17" fill="#1A1A18">처음</text>
    <text x="300" y="296" text-anchor="middle" font-size="17" fill="#1A1A18">중간</text>
    <text x="520" y="296" text-anchor="middle" font-size="17" fill="#1A1A18">끝</text>
    <text x="300" y="324" text-anchor="middle" font-size="15" fill="#55554F">관련 정보의 위치</text>
    <text x="22" y="150" text-anchor="middle" font-size="15" fill="#55554F" transform="rotate(-90 22 150)">정확도</text>
    <text x="540" y="24" text-anchor="end" font-size="14" fill="#55554F">개념도 (수치 없음)</text>
  </svg>`;
  return `<div class="curve">${svg}<div class="cside"><h3>${esc(s.side.t)}</h3>${s.side.items.map(t=>`<div>${esc(t)}</div>`).join('')}</div></div>`;
}

function toc(s){
  const half=Math.ceil(s.items.length/2), cols=[s.items.slice(0,half), s.items.slice(half)];
  const row=([name,a=name,b=a])=>{ const [x,y]=pageSpan(a,b); return `<a data-go="${x}"><span>${esc(name)}</span><span>${x===y?x:`${x}–${y}`}</span></a>`; };
  return `<div class="toc">${cols.map(c=>`<div>${c.map(row).join('')}</div>`).join('')}</div>`;
}

const R={duo,hub,flow,flows,pairs,cards,table,code,code2,codefan,codeflow,cardscode,chat,tokens,layers,equation,canvas,loop,seq,attention,ctxbars,curve,toc};

function render(s, i){
  if(s.type==='title') return `<section class="slide title-slide" data-i="${i}"><div class="kicker">${esc(s.kicker)}</div><div class="tl"><div class="bar"></div><h1>${br(s.title)}</h1><div class="sub">${esc(s.sub)}</div></div><div class="by">${esc(s.by)}</div></section>`;
  const num=String(i+1).padStart(2,'0');
  const legend=s.legend?`<div class="legend">${s.legend.map(([k,t])=>`<span><b class="${k==='dash'?'dash':''}"></b>${esc(t)}</span>`).join('')}</div>`:'';
  const src=s.src?`<div>${esc(s.src)}</div>`:'';
  return `<section class="slide" data-i="${i}"><header class="sh"><h2>${esc(s.title)}</h2><div class="meta">${s.check?'<span class="chk">확인 중</span>':''}${s.sec?`<span>${esc(s.sec)}</span>`:''}<span>${num}</span></div></header>`+
    `<div class="body">${R[s.type](s)}</div>`+
    (s.nofoot?`${legend?`<div class="floatlg">${legend}</div>`:''}</section>`:`<footer class="sf"><div class="note">${s.note?`<i></i><p>${br(s.note)}</p>`:''}</div><div class="side-info">${legend}${src}</div></footer></section>`);
}

/* ---------- 조작 ---------- */
const stage=document.getElementById('stage');
stage.innerHTML=pageRefs(S.map(render).join(''));
/* 묶음 상자 안의 반복 화살표(rloop: [아래 칸, 위 칸]): 아래 칸 오른쪽에서 위 칸 오른쪽으로 되돌아감 */
(function drawLoops(){
  document.querySelectorAll('.col.grp[data-loop]').forEach(g=>{
    const [a,b]=g.dataset.loop.split(',').map(Number);
    const ps=[...g.children].filter(e=>e.classList.contains('pill')), pa=ps[a], pb=ps[b], sv=g.querySelector('svg.gloop');
    if(!pa||!pb||!sv) return;
    const xr=Math.max(pa.offsetLeft+pa.offsetWidth, pb.offsetLeft+pb.offsetWidth);
    const ya=pa.offsetTop+pa.offsetHeight/2, yb=pb.offsetTop+pb.offsetHeight/2, xo=xr+14;
    sv.setAttribute('width',g.offsetWidth+60); sv.setAttribute('height',g.offsetHeight);
    sv.innerHTML=`<path d="M${xr+2},${ya} H${xo} V${yb} H${xr+4}" fill="none" stroke="#1A1A18" stroke-width="2" marker-end="url(#ah)"/>`+
      `<text x="${xo+8}" y="${((ya+yb)/2+5).toFixed(1)}" font-size="15" fill="#55554F">반복</text>`;
  });
})();
/* 토큰 생성 띠의 되돌림 화살표: 새 토큰 아래에서 입력 끝으로 (offset 값은 장의 축소와 무관) */
(function drawGenBack(){
  document.querySelectorAll('.cgen').forEach(g=>{
    const row=g.querySelector('.grow'), seq=g.querySelector('.gseq'), nx=g.querySelector('.gnext'), sv=g.querySelector('svg.gback');
    if(!row||!seq||!nx||!sv) return;
    const x1=row.offsetLeft+nx.offsetLeft+nx.offsetWidth/2, y1=row.offsetTop+nx.offsetTop+nx.offsetHeight;
    const x2=row.offsetLeft+seq.offsetLeft+seq.offsetWidth-4, y2=row.offsetTop+seq.offsetTop+seq.offsetHeight;
    const yb=Math.max(y1,y2)+18;
    sv.setAttribute('width',g.offsetWidth); sv.setAttribute('height',yb+6);
    sv.innerHTML=`<path d="M${x1},${y1+3} V${yb} H${x2} V${y2+5}" fill="none" stroke="#1A1A18" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>`;
  });
})();
const slides=[...stage.querySelectorAll('.slide')];
const cnt=document.getElementById('cnt'), list=document.getElementById('list');
let cur=0;
function go(i){
  i=Math.max(0,Math.min(slides.length-1,i|0));
  const prev=cur;
  slides[cur].classList.remove('on'); cur=i; slides[cur].classList.add('on');
  if(i!==prev) rhNext();
  cnt.textContent=`${cur+1} / ${slides.length}`;
  /* 샌드박스 미리보기(origin null)에서는 주소를 바꿀 수 없어 SecurityError가 나므로 실패해도 넘어갑니다 */
  if(location.hash!=='#'+(cur+1)){ try{ history.replaceState(null,'','#'+(cur+1)); }catch(e){} }
}
function fit(){
  const s=Math.min(innerWidth/1280, innerHeight/720)*0.96;
  document.documentElement.style.setProperty('--s', s.toFixed(4));
}
list.querySelector('.box').innerHTML=S.map((s,i)=>`<button type="button" data-go="${i+1}"><span>${i+1}</span>${esc(s.title)}</button>`).join('');
function toggleList(open){ list.classList.toggle('open', open ?? !list.classList.contains('open')); }
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){ go(+g.dataset.go-1); toggleList(false); return; }
  if(e.target===list) toggleList(false);
});
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('openList').onclick=()=>toggleList();
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ toggleList(false); return; }
  if(list.classList.contains('open')) return;
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); go(cur+1); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home') go(0);
  else if(e.key==='End') go(slides.length-1);
  else if(e.key==='g'||e.key==='G') toggleList();
});
/* 터치 밀기로 넘기기는 뺐습니다(확대한 채 화면을 움직여도 장이 넘어가서). 넘기기는 버튼, 키보드, 목록으로 */
addEventListener('hashchange',()=>{ const n=parseInt(location.hash.slice(1),10); if(n) go(n-1); });
/* 리허설 모드: 장마다 30초. 일찍 넘기면 남은 시간이 오른쪽 게이지에 쌓이고, 30초를 넘기면 쌓인 시간에서 빠짐(0 아래는 회색) */
const RH_SEC=30, RH_MAX=120;
const rhEl=document.getElementById('rh'), rhBtn=document.getElementById('rehearse');
const rhLine=rhEl.querySelector('.line'), rhPos=document.querySelector('#rhb .pos'), rhNeg=document.querySelector('#rhb .neg'), rhVal=document.getElementById('rhv');
let rhOn=false, rhStart=0, rhBank=0, rhRaf=0;
function rhElapsed(){ return (performance.now()-rhStart)/1000; }
function rhNext(){ if(!rhOn) return; rhBank+=RH_SEC-rhElapsed(); rhStart=performance.now(); }
function rhDraw(){
  if(!rhOn) return;
  const t=rhElapsed(), left=Math.max(0,1-t/RH_SEC), bank=rhBank-Math.max(0,t-RH_SEC);
  rhLine.style.transform=`scaleX(${left})`;
  const f=Math.min(1,Math.abs(bank)/RH_MAX)*50;
  rhPos.style.height=(bank>0?f:0)+'%'; rhNeg.style.height=(bank<0?f:0)+'%';
  rhVal.textContent=(bank>=0?'+':'−')+Math.round(Math.abs(bank))+'s';
  rhVal.style.color=bank<0?'#8E8F92':'#C2552A';
  rhRaf=requestAnimationFrame(rhDraw);
}
function rhToggle(on){
  rhOn=on ?? !rhOn; rhBtn.setAttribute('aria-pressed',String(rhOn)); rhEl.classList.toggle('on',rhOn); document.body.classList.toggle('rh',rhOn);
  cancelAnimationFrame(rhRaf);
  if(rhOn){ rhBank=0; rhStart=performance.now(); rhDraw(); }
}
rhBtn.onclick=()=>rhToggle();
addEventListener('keydown',e=>{ if((e.key==='r'||e.key==='R')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!list.classList.contains('open')) rhToggle(); });
addEventListener('resize',fit);
fit();
go((parseInt(location.hash.slice(1),10)||1)-1);
</script>
</body>
